name: Release

# Changesets' standard PR-based flow (see .changeset/config.json):
# 1. Every push to main with pending changeset files causes this job to
#    open/update a "Version Packages" PR (bumps package.json + writes
#    CHANGELOG.md from the accumulated .changeset/*.md files).
# 2. Merging that PR re-triggers this same job; changesets/action detects
#    there are no pending changesets left and instead runs the `publish`
#    command below, which is what actually ships the release to npm.
#
# There is intentionally one job/workflow for both steps — that's the
# documented changesets/action@v1 pattern, not an oversight.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # Required for `npm publish --provenance` to attach a signed GitHub
      # Actions attestation linking the published package to this exact
      # workflow run and commit.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        timeout-minutes: 10
        with:
          # npm Trusted Publishing (OIDC) requires npm CLI >=11.5.1, which
          # needs Node >=22.14.0 — Node 20's bundled npm is too old.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - run: pnpm build

      - name: Update npm to a version that supports Trusted Publishing
        run: npm install -g npm@latest
        timeout-minutes: 10

      # Release PRs opened with the default GITHUB_TOKEN do not trigger
      # workflows (GitHub's loop prevention), so CI never reports on the
      # "Version Packages" PR and branch protection blocks the merge
      # forever. A GitHub App installation token is a distinct actor, so
      # PRs it opens DO trigger CI. Scoped to the step below only — the
      # npm publish in that same step authenticates via OIDC Trusted
      # Publishing (`id-token: write`), which is unrelated to this token.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          # `pnpm release` runs `changeset publish`, which publishes every
          # package with pending version bumps via `npm publish`, honoring
          # each package's `publishConfig.access` ("public" — required
          # because @tamga/sdk is a scoped package and npm defaults scoped
          # packages to private). Authentication is via npm Trusted
          # Publishing (OIDC, see the job's `id-token: write` permission
          # above) — no NPM_TOKEN secret involved. npm auto-attaches
          # provenance for trusted-publishing publishes, so no explicit
          # NPM_CONFIG_PROVENANCE is needed either.
          publish: pnpm release
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
