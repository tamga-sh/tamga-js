name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # Coverage thresholds (80% lines/functions/branches/statements) are
      # enforced by vitest.config.ts, not re-specified here.
      #
      # Deliberately `pnpm test:coverage`, NOT `pnpm test -- --coverage`:
      # pnpm 10.x inserts its own `--` before forwarded args, so the latter
      # actually runs `vitest run -- --coverage` — vitest treats anything
      # after that `--` as a positional test-file filter, not a flag, so
      # `--coverage` was silently never enabling coverage collection at
      # all. Confirmed via a CI log showing that literal invocation and
      # `coverage/lcov.info` never being produced.
      - run: pnpm test:coverage

      # Verifies the tsup dual ESM+CJS build actually emits — a broken
      # entry/format config would otherwise only surface at publish time.
      - run: pnpm build

      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Explicit path required: codecov-action v4's auto-search skips
          # gitignored paths, and `coverage/` is gitignored here — without
          # this it silently uploads nothing ("Found 0 coverage files").
          files: ./coverage/lcov.info
          # Required when CODECOV_TOKEN is the org's shared Global Upload
          # Token (one token for every Tamga SDK repo) rather than a
          # per-repo token — without it Codecov can't tell which repo an
          # upload belongs to.
          slug: tamga-sh/tamga-js
          fail_ci_if_error: false

  # Separate from the `test` job above: this does NOT run lint/typecheck/test
  # (those are Node-only tooling). It runs the built dist/ output on Deno and
  # Bun to catch runtime-incompatible syntax or API usage that Node-only
  # testing would miss — the whole point of this SDK targeting 4 runtimes
  # from one codebase.
  smoke:
    name: smoke (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        runtime: [deno, bun]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - if: matrix.runtime == 'deno'
        run: deno run --allow-read scripts/smoke.mjs

      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2

      - if: matrix.runtime == 'bun'
        run: bun run scripts/smoke.mjs

  # Changesets versions from .changeset/*.md files, not from Conventional
  # Commits — unlike release-please in the sibling SDKs. A PR that forgets one
  # ships no release at all, silently. This turns that omission into a failed
  # check. When a change genuinely needs no release (docs, CI, refactors), run
  # `pnpm changeset --empty` and commit that instead; the decision then becomes
  # explicit rather than forgotten.
  changeset:
    name: changeset present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: corepack enable

      - run: pnpm install --frozen-lockfile

      - name: Require a changeset (or an explicit empty one)
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
